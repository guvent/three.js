<!DOCTYPE html>
<html lang="en">
<head>
	<title>three.js - Winter Road Terrain</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<link type="text/css" rel="stylesheet" href="main.css">
	<style>
		body {
			background-color: #b3d4ff;
			color: #444;
		}
		a {
			color: #08f;
		}
	</style>
</head>
<body>
	<div id="info">
		<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - Winter Road Terrain<br/>
	</div>

	<script type="importmap">
		{
			"imports": {
				"three": "../build/three.module.js",
				"three/addons/": "./jsm/"
			}
		}
	</script>

	<script type="module">

		import * as THREE from 'three';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

		let camera, scene, renderer, clock;

		init();

		function init() {
			const container = document.createElement( 'div' );
			document.body.appendChild( container );

			camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.1, 100 );
			camera.position.set( 10, 8, 15 );

			scene = new THREE.Scene();
			scene.background = new THREE.Color( 0xb3d4ff );
			scene.fog = new THREE.Fog( 0xb3d4ff, 10, 50 );

			clock = new THREE.Clock();

			// lights
			const hemiLight = new THREE.HemisphereLight( 0xffffff, 0x444444, 2 );
			hemiLight.position.set( 0, 20, 0 );
			scene.add( hemiLight );

			const dirLight = new THREE.DirectionalLight( 0xffffff, 2 );
			dirLight.position.set( 5, 10, 5 );
			dirLight.castShadow = true;
			dirLight.shadow.camera.top = 20;
			dirLight.shadow.camera.bottom = - 20;
			dirLight.shadow.camera.left = - 20;
			dirLight.shadow.camera.right = 20;
			dirLight.shadow.camera.near = 0.1;
			dirLight.shadow.camera.far = 40;
			scene.add( dirLight );

			// terrain
			const winterRoad = createWinterRoad();
			winterRoad.traverse( function ( object ) {
				if ( object.isMesh ) {
					object.castShadow = true;
					object.receiveShadow = true;
				}
			} );
			scene.add( winterRoad );

			renderer = new THREE.WebGLRenderer( { antialias: true, alpha: true } );
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.setAnimationLoop( animate );
			renderer.shadowMap.enabled = true;
			container.appendChild( renderer.domElement );

			const controls = new OrbitControls( camera, renderer.domElement );
			controls.target.set( 0, 0, 0 );
			controls.update();

			window.addEventListener( 'resize', onWindowResize );
		}

		function createWinterRoad() {
			function mat( color ) {
				return new THREE.MeshToonMaterial( { color } );
			}

			const winterRoad = new THREE.Group();
			winterRoad.name = 'WinterRoad';

			const shape = new THREE.Shape();
			shape.moveTo( 2, 0 );
			shape.bezierCurveTo( 2.2, 0.1, 2.3, 0.6, 2.8, 0.5 ); // Plow margin bulge
			shape.lineTo( 12, 0.5 );
			shape.lineTo( 12, -0.2 );
			shape.lineTo( 2, -0.2 );

			const extrudeSettings = { depth: 240, bevelEnabled: false, curveSegments: 4 };
			const sideGeom = new THREE.ExtrudeGeometry( shape, extrudeSettings );

			const rightGround = new THREE.Mesh( sideGeom, mat( 0xeeeeff ) );
			rightGround.position.z = -120;
			rightGround.name = 'rightGround';
			winterRoad.add( rightGround );

			const leftGround = new THREE.Mesh( sideGeom, mat( 0xeeeeff ) );
			leftGround.rotation.y = Math.PI;
			leftGround.position.z = 120;
			leftGround.name = 'leftGround';
			winterRoad.add( leftGround );

			// Road (Ice)
			const roadGeo = new THREE.PlaneGeometry( 4, 240 );
			const road = new THREE.Mesh( roadGeo, mat( 0xaaddff ) );
			road.rotation.x = - Math.PI / 2;
			road.position.y = 0.01;
			road.name = 'road';
			winterRoad.add( road );

			// Gentle Hills
			const hillsGrp = new THREE.Group();
			hillsGrp.name = 'hills';
			winterRoad.add( hillsGrp );

			let m_w = 123456789;
			let m_z = 987654321;
			const mask = 0xffffffff;
			function seedRandom() {
				m_z = ( 36969 * ( m_z & 65535 ) + ( m_z >> 16 ) ) & mask;
				m_w = ( 18000 * ( m_w & 65535 ) + ( m_w >> 16 ) ) & mask;
				let result = ( ( m_z << 16 ) + m_w ) & mask;
				result /= 4294967296;
				return result + 0.5;
			}

			// Winter Trees
			const treesGrp = new THREE.Group();
			treesGrp.name = 'trees';
			winterRoad.add( treesGrp );

			const scales = [ 0.8, 1.2, 1.6 ];

			for ( let i = 0; i < 120; i ++ ) {
				const tree = new THREE.Group();
				
				const trunkGeo = new THREE.CylinderGeometry( 0.15, 0.2, 1.5, 8 );
				const trunk = new THREE.Mesh( trunkGeo, mat( 0x8b6914 ) );
				trunk.position.y = 0.75;
				tree.add( trunk );

				const leavesGeo = new THREE.ConeGeometry( 0.8, 2.0, 8 );
				const leaves = new THREE.Mesh( leavesGeo, mat( 0x4a7c59 ) );
				leaves.position.y = 2.2;
				tree.add( leaves );

				const snowTopGeo = new THREE.ConeGeometry( 0.43, 1.2, 8, 1, true );
				const snowTop = new THREE.Mesh( snowTopGeo, mat( 0xeeeeff ) );
				snowTop.position.y = 2.7;
				tree.add( snowTop );

				tree.rotation.y = seedRandom() * Math.PI * 2;
				const idx = Math.floor( seedRandom() * scales.length );
				const scale = scales[ idx === scales.length ? 0 : idx ];
				tree.scale.setScalar( scale );

				const side = seedRandom() < 0.5 ? -1 : 1;
				tree.position.x = side * ( 4.0 + seedRandom() * 7.0 );
				tree.position.y = 0.2; // sink into snow to guarantee ground contact
				tree.position.z = ( seedRandom() - 0.5 ) * 230;

				treesGrp.add( tree );
			}

			for ( let i = 0; i < 60; i ++ ) {
				const radius = 1.0 + seedRandom() * 2.0;
				const hillGeo = new THREE.SphereGeometry( radius, 16, 16 );
				const hill = new THREE.Mesh( hillGeo, mat( 0xeeeeff ) );

				const side = seedRandom() < 0.5 ? -1 : 1;
				const edgeOffset = 4.0 + seedRandom() * 4.0;
				hill.position.x = side * edgeOffset;
				hill.position.y = 0.5; // sit tightly on the deep snow
				hill.position.z = ( seedRandom() - 0.5 ) * 230;
				
				hill.scale.set( 1 + seedRandom(), 0.3 + seedRandom() * 0.3, 1 + seedRandom() );

				hillsGrp.add( hill );
			}

			return winterRoad;
		}

		function onWindowResize() {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize( window.innerWidth, window.innerHeight );
		}

		function animate() {
			renderer.render( scene, camera );
		}

	</script>
</body>
</html>
